<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frase-Chave do Sistema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060a; --bg2:#0b0e17; --ink:#c9d4e6; --dim:#5d6b85;
  --cyan:#00f0ff; --magenta:#ff2a8a; --amber:#ffb400;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  background:
    radial-gradient(ellipse at 20% 0%, #1a0b2e55, transparent 55%),
    radial-gradient(ellipse at 90% 100%, #00f0ff18, transparent 50%),
    var(--bg);
  color:var(--ink);
  font-family:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;overflow-x:hidden;position:relative;
}
/* chuva neon */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(105deg,transparent 0 46px,#00f0ff12 47px,transparent 49px);
  animation:rain 1.2s linear infinite;opacity:.7;
}
@keyframes rain{to{background-position:-30px 120px}}
/* scanlines */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,#0000 0 2px,#00000055 3px);
  mix-blend-mode:multiply;
}
.panel{
  position:relative;z-index:1;width:min(720px,100%);
  background:linear-gradient(160deg,#0e1220ee,#070911f2);
  border:1px solid #00f0ff44;
  padding:40px 36px 36px;
  box-shadow:0 0 0 1px #000,0 0 40px #00f0ff22,inset 0 0 60px #00000099;
  clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px));
}
.panel::before{
  content:"";position:absolute;left:0;top:0;width:100%;height:3px;
  background:linear-gradient(90deg,var(--magenta),var(--cyan),transparent);
}
.tag{
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-size:.72rem;letter-spacing:.25em;color:var(--dim);text-transform:uppercase;
  margin-bottom:28px;
}
.tag b{color:var(--amber);font-weight:400}
h1{
  font-family:Orbitron,"Segoe UI",sans-serif;font-weight:800;
  font-size:clamp(1.15rem,3.6vw,1.6rem);letter-spacing:.14em;text-transform:uppercase;
  color:var(--cyan);text-shadow:0 0 12px #00f0ff88;
  display:flex;align-items:center;gap:14px;margin-bottom:32px;
  position:relative;
}
h1 .sym{font-size:1.9em;filter:drop-shadow(0 0 8px var(--magenta));animation:spin 14s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
h1::after{content:attr(data-t);position:absolute;left:calc(2.9em + 14px);color:var(--magenta);
  clip-path:inset(0 0 60% 0);animation:glitch 4s steps(1) infinite;opacity:.0}
@keyframes glitch{
  0%,92%,100%{opacity:0;transform:translateX(0)}
  93%{opacity:.8;transform:translateX(-3px)}
  95%{opacity:.8;transform:translateX(3px)}
  97%{opacity:0}
}
.lines p{
  font-size:clamp(1.02rem,2.8vw,1.3rem);line-height:1.5;
  padding:12px 0 12px 18px;border-left:2px solid #ffffff14;
  margin-bottom:6px;transition:.25s;
  opacity:0;animation:in .7s forwards;
}
.lines p:nth-child(1){animation-delay:.2s}
.lines p:nth-child(2){animation-delay:.6s}
.lines p:nth-child(3){animation-delay:1s}
.lines p:nth-child(4){animation-delay:1.5s}
.lines p:nth-child(5){animation-delay:1.9s}
.lines p:nth-child(6){animation-delay:2.4s}
@keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.lines p:hover{border-left-color:var(--cyan);background:#00f0ff0a;padding-left:26px}
.lines em{font-style:normal;color:var(--cyan);text-shadow:0 0 8px #00f0ff66}
.lines .y{color:var(--magenta);text-shadow:0 0 8px #ff2a8a66}
.lines .c{color:var(--amber)}
.lines p.final{
  margin-top:20px;border-left:3px solid var(--magenta);
  font-family:Orbitron,sans-serif;font-weight:500;letter-spacing:.06em;
  color:#fff;text-shadow:0 0 14px #ff2a8a99;
  background:linear-gradient(90deg,#ff2a8a18,transparent);
}
.foot{margin-top:30px;font-size:.7rem;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.foot span{color:var(--cyan);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (max-width:480px){.panel{padding:30px 20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.lines p{opacity:1}}
</style>
</head>
<body>
<main class="panel">
  <div class="tag"><span>// SYS.NOIR_v0.1</span><b>● ONLINE</b></div>
  <h1 data-t="Frase-Chave do Sistema"><span class="sym">☯️</span>Frase-Chave do Sistema</h1>
  <div class="lines">
    <p><em>Yin</em> encontra <em>Yin</em>.</p>
    <p><span class="y">Yang</span> encontra <span class="y">Yang</span>.</p>
    <p><span class="c">Chi</span> une os dois.</p>
    <p>CPP transforma intenção em potência.</p>
    <p>Fa Jin transforma potência em destruição.</p>
    <p class="final">A Harmonia transforma o lutador.</p>
  </div>
  <div class="foot">&gt; aguardando input<span>_</span></div>
</main>
</body>
</html>
